[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
  "@reactive/=lib/reactive-lib-omni/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[invariant]
runs = 256
depth = 80
fail_on_revert = false

[fmt]
line_length = 110

[lint]
exclude_lints = ["block-timestamp", "mixed-case-function", "mixed-case-variable", "screaming-snake-case-immutable", "screaming-snake-case-const", "unaliased-plain-import", "asm-keccak256", "unsafe-typecast"]
